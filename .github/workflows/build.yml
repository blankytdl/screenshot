name: Build GameShot (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify DXcam OpenCV support
        run: python -c "import cv2, dxcam; print('OpenCV', cv2.__version__); print('DXcam installed')"

      - name: Restore source and compile
        run: |
          python -c "import base64,zlib,pathlib; p=pathlib.Path('GameShot.py'); q=pathlib.Path('GameShot.py.zlib.b64'); p.write_bytes(zlib.decompress(base64.b64decode(q.read_text(encoding='ascii')))) if not p.exists() and q.exists() else None"
          python -m py_compile GameShot.py

      - name: Commit expanded source to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GameShot.py
          git rm --ignore-unmatch GameShot.py.zlib.b64
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Add expanded GameShot source [skip ci]"
          git push

      - name: Build executable
        run: python build.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GameShot-windows-x64
          path: dist/GameShot.exe
          if-no-files-found: error
          retention-days: 30
