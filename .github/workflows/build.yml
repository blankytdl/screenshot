name: Build GameShot (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore source and compile
        run: |
          python -c "import base64,zlib,pathlib; pathlib.Path('GameShot.py').write_bytes(zlib.decompress(base64.b64decode(pathlib.Path('GameShot.py.zlib.b64').read_text(encoding='ascii'))))"
          python -m py_compile GameShot.py

      - name: Build executable
        run: python build.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GameShot-windows-x64
          path: dist/GameShot.exe
          if-no-files-found: error
          retention-days: 30
